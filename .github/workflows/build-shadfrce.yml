name: Build Shadow Force (CRT Adjust)

# Builds cores/shadfrce for MiSTer with rmonic79's CRT Adjust module.
# jtcores is checked out at a fixed commit and jtframe-patches/crt_adjust.patch
# is applied to it; the .rbf is uploaded as an artifact and committed to releases/.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'cores/shadfrce/**'
      - 'jtframe-patches/**'
      - '.github/workflows/build-shadfrce.yml'

permissions:
  contents: write

env:
  JTCORES_REPO: https://github.com/jotego/jtcores.git
  JTCORES_SHA: a3c43159aa12e9b05f53a23e050206977c2fba1d
  CORE: shadfrce
  RBF_PREFIX: ffshadfrce

jobs:
  mister:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/checkout@v4

      - name: Fetch jtcores
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git init jtcores
          cd jtcores
          git remote add origin "$JTCORES_REPO"
          git fetch --depth 1 origin "$JTCORES_SHA"
          git checkout --quiet FETCH_HEAD
          # only the modules Shadow Force uses (some jtcores submodules are private)
          git submodule update --init --depth 1 modules/fx68k modules/jt51 modules/jt6295

      - name: Add the core and apply the CRT Adjust patch
        run: |
          rm -rf "jtcores/cores/$CORE"
          cp -r "cores/$CORE" "jtcores/cores/$CORE"
          git -C jtcores apply --verbose "$GITHUB_WORKSPACE/jtframe-patches/crt_adjust.patch"
          cp jtframe-patches/build-in-docker.sh jtcores/

      - name: Compile (Quartus in jotego/jtcore20)
        run: |
          docker run --rm --network host -v "$(pwd)/jtcores":/jtcores jotego/jtcore20 \
            bash /jtcores/build-in-docker.sh "$CORE" mister

      - name: Collect the .rbf
        id: rbf
        run: |
          RBF=$(find jtcores/release jtcores/cores/$CORE/mister -name '*.rbf' 2>/dev/null | head -n 1)
          test -n "$RBF"
          OUT=${RBF_PREFIX}_$(date -u +%Y%m%d).rbf
          mkdir -p out
          cp -v "$RBF" "out/$OUT"
          ls -l out
          echo "name=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rbf.outputs.name }}
          path: out/${{ steps.rbf.outputs.name }}

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            jtcores/log
            jtcores/cores/${{ env.CORE }}/mister/output_files/*.rpt
          if-no-files-found: ignore

      - name: Commit the .rbf to releases/
        run: |
          cp "out/${{ steps.rbf.outputs.name }}" releases/
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add releases/
          git commit -m "releases: ${{ steps.rbf.outputs.name }} (CRT Adjust) [skip ci]" || exit 0
          git push
